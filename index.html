<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>İLEFBot — Bakımda</title>

    <style>
        :root {
            --green: #2f7d46;
            --green-light: #6ca67b;
            --text: #171917;
            --muted: #777b78;
            --border: rgba(30, 40, 32, .08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    rgba(30, 70, 40, .035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(30, 70, 40, .035) 1px,
                    transparent 1px
                ),
                #fafbf9;

            background-size: 48px 48px;

            color: var(--text);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        /* Ambient glow */

        body::before {
            content: "";
            position: fixed;
            width: 650px;
            height: 650px;
            border-radius: 50%;

            background: radial-gradient(
                circle,
                rgba(47, 125, 70, .10) 0%,
                rgba(47, 125, 70, .045) 35%,
                transparent 70%
            );

            filter: blur(20px);
            pointer-events: none;
        }

        .page {
            position: relative;
            z-index: 1;

            width: min(680px, 90vw);
            text-align: center;

            animation: appear .9s cubic-bezier(.2,.8,.2,1);
        }

        /* Logo */

        .logo-wrap {
            position: relative;

            width: 148px;
            height: 148px;

            margin: 0 auto 42px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrap::before {
            content: "";

            position: absolute;
            inset: -18px;

            border: 1px solid rgba(47, 125, 70, .10);
            border-radius: 50%;

            animation: pulse 3s ease-in-out infinite;
        }

        .logo-wrap::after {
            content: "";

            position: absolute;
            inset: -34px;

            border: 1px solid rgba(47, 125, 70, .045);
            border-radius: 50%;
        }

        .logo {
            width: 128px;
            height: 128px;

            object-fit: contain;

            filter:
                drop-shadow(0 12px 25px rgba(47, 125, 70, .14));
        }

        /* Text */

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;

            margin-bottom: 20px;

            color: var(--green);

            font-size: 12px;
            font-weight: 600;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .eyebrow span {
            width: 6px;
            height: 6px;

            border-radius: 50%;
            background: var(--green);

            box-shadow: 0 0 0 5px rgba(47, 125, 70, .08);

            animation: blink 2s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(42px, 7vw, 72px);
            line-height: .98;
            letter-spacing: -.055em;
            font-weight: 650;

            margin-bottom: 22px;
        }

        h1 strong {
            color: var(--green);
            font-weight: inherit;
        }

        .description {
            max-width: 510px;
            margin: 0 auto;

            color: var(--muted);

            font-size: 16px;
            line-height: 1.7;
            letter-spacing: -.01em;
        }

        /* Progress */

        .progress {
            width: 240px;
            height: 3px;

            margin: 36px auto 0;

            overflow: hidden;

            border-radius: 999px;
            background: rgba(47, 125, 70, .10);
        }

        .progress::before {
            content: "";

            display: block;

            width: 42%;
            height: 100%;

            border-radius: inherit;
            background: var(--green);

            animation: progress 2.4s ease-in-out infinite;
        }

        /* Footer */

        footer {
            position: fixed;
            z-index: 2;

            left: 0;
            bottom: 30px;

            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;

            color: #a1a5a2;

            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        footer::before,
        footer::after {
            content: "";

            width: 28px;
            height: 1px;

            background: var(--border);
        }

        /* Animations */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: .7;
            }

            50% {
                transform: scale(1.04);
                opacity: 1;
            }
        }

        @keyframes blink {
            0%, 100% {
                opacity: .45;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes progress {
            0% {
                transform: translateX(-130%);
            }

            50% {
                transform: translateX(110%);
            }

            100% {
                transform: translateX(280%);
            }
        }

        @media (max-width: 600px) {
            .logo-wrap {
                width: 120px;
                height: 120px;
                margin-bottom: 34px;
            }

            .logo {
                width: 105px;
                height: 105px;
            }

            h1 {
                font-size: 45px;
            }

            .description {
                font-size: 15px;
                padding: 0 10px;
            }

            footer {
                bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="logo-wrap">
            <img
                class="logo"
                src="https://i.hizliresim.com/ar4mbl6.png"
                alt="İLEFBot"
            >
        </div>

        <div class="eyebrow">
            <span></span>
            BAKIMDA
        </div>

        <h1>
            İLEFBot<br>
            <strong>yenileniyor.</strong>
        </h1>

        <p class="description">
            Daha iyi bir deneyim için İLEFBot'u baştan geliştiriyoruz.
            Yeni sürüm üzerinde çalışmalar devam ediyor.
        </p>

        <div class="progress"></div>

    </main>

    <footer>
        Murat Özçelik | Bolu Abant İzzet Baysal Üniversitesi İletişim Fakültesi
    </footer>

</body>
</html>
